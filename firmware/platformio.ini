; Creator Micro 2 — per-key RGB, using the SAME driver stack as the stock
; firmware: ESP-IDF's espressif/led_strip component with the SPI backend.
;
; Why not Arduino/Adafruit_NeoPixel: that build ran cleanly (serial logs proved
; the code executed) but produced no light. Stock firmware lighting still works
; perfectly on the same hardware, so the pins and the LED power rail are fine —
; the RMT path in Adafruit_NeoPixel 1.12.x silently fails on ESP32-S3 with
; Arduino core 3.x. Replicating the vendor's exact driver removes that variable.
;
; Config read out of the stock firmware's two led_strip_new_spi_device call sites:
;   keys    : GPIO 7, 13 LEDs, SPI2_HOST
;   ambient : GPIO 6,  8 LEDs, SPI3_HOST

[env:cm2]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf

board_build.flash_mode = dio
board_upload.flash_size = 16MB

monitor_speed = 115200
